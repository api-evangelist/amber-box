name: Amber Box
description: >-
  AmberBox is an indoor gunshot detection company (San Francisco, CA) that
  builds sensor hardware and a response platform for schools, offices, and
  public buildings. Its patented tri-factor detection algorithm combines
  percussion, audio, and infrared signatures to identify a firearm discharge
  with a near-zero false-alarm rate, then automatically notifies on-site
  security and law enforcement to cut emergency response time by an average of
  five minutes. AmberBox integrates with existing physical-security estates
  (access control, IP video/VMS, PSIM, mass-notification, and fire-alarm-style
  life-safety systems) via closed-contact relay switches and TCP/IP relay input
  modules rather than a public developer API. Surfaced as an Uncork Capital
  portfolio company and added to the API Evangelist network for enrichment; the
  company publishes no public REST/GraphQL API, developer portal, or SDKs at
  this time.
